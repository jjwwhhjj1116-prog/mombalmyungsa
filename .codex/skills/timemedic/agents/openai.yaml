interface:
  display_name: "몸의 발명사"
  short_description: "5챕터 건강 역사 대본과 Omni 제작 파이프라인"
  default_prompt: "Use $timemedic to 검증된 건강·의학 주제를 현재 결과와 질문, 역사적 필요와 부분 성공, 다중 딜레마, 질문 전환과 작동 해부, 현재 회수의 5챕터로 작성해 주세요. 이해와 인과를 보존한 최종 TTS가 180초를 넘으면 16:9 longform으로 전환하고, 사용자 승인·문장별 스토리보드·Flow Omni 프롬프트·파일럿을 거쳐 최종 TTS 강제정렬을 영상·장면·자막의 유일한 시간축으로 사용해 주세요."
