interface:
  display_name: "몸의 발명사"
  short_description: "5챕터 건강 역사 대본과 Omni 제작 파이프라인"
  default_prompt: "Use $timemedic to 검증된 건강·의학 주제를 현재 결과와 질문, 역사적 필요와 부분 성공, 다중 딜레마, 질문 전환과 작동 해부, 현재 회수의 5챕터로 작성해 주세요. 중간에는 '그래서, 사람을 살리는 질문부터 뒤집습니다.', 마지막에는 '몸을 살린 생각의 전환, [대상]은/는 이렇게 탄생했습니다.'를 계약에 맞게 정확히 한 번 사용하고, ElevenLabs voice ID wTGzPmtwk7nDNybbk0OL의 고정 프로필로 연속 합성해 주세요. 실제 TTS가 180초를 넘으면 롱폼 다섯 관문을 검사하고, 통과한 소재만 8~10분·480~600초 16:9 longform으로 다시 승인해 주세요. Flow 전에는 시대·지역·복식·건축·도구·실재 제품 고증 카드를 잠그고, 최종 TTS 강제정렬을 영상·장면·자막의 유일한 시간축으로 사용해 주세요."
