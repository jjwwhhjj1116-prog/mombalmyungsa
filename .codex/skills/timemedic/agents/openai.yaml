interface:
  display_name: "몸의 발명사"
  short_description: "6단계 대본과 하루 2편 Omni 파이프라인 운영"
  default_prompt: "Use $timemedic to 검증된 건강·의학 주제를 50~58초 6단계 대본으로 만들고, 사용자 승인·문장별 스토리보드·공개 튜토리얼에서 추출한 고수준 멀티샷 문법의 Flow Omni 프롬프트·파일럿을 거쳐 주세요. 최종 TTS 강제정렬을 영상·장면·자막의 유일한 시간축으로 사용하고 영상 길이 오차는 1프레임 이하, 본문 자막은 Gmarket Sans Bold 100px과 x=540 y=1200 중심 앵커로 검증한 뒤 오전 10시 비공개 업로드·11시 공개와 오후 6시 비공개 업로드·7시 공개의 하루 두 편 롤링 큐로 운영해 주세요."
